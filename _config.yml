# Site settings
title: Begoña Pericàs Herrero # site title
description: >- # site description
  I am a neurocognitive speech and language researcher interested in how bilingual 
  children develop phonetic and phonological knowledge across their two languages 
  and how adults learn speech sounds in a second language. In my research, I use 
  electrophysiological and behavioural methods, including phonetic training games, 
  to understand how listeners learn to perceive and categorize speech sounds. 
  I am currently completing my postdoctoral research fellowship at University College London,
  investigating the role of input variability in second-language speech learning using 
  wearable EEG devices, which simultaneously record EEG and speech data. See my code for EEG data analysis at <a href="https://github.com/BPericas" target="_blank" rel="noopener">@github</a>.
lang: en-UK # default lang
timezone: UK # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/BPericas/BPericas.github.io # site repo [optional]
mode: light # default theme "dark" | "light"

# Profile settings
author:
  name: Begoña Pericas Herrero # author name
  bio: >- # tell to the world
     I am a neurocognitive speech and language researcher interested in how bilingual 
     children develop phonetic and phonological knowledge across their two languages 
     and how adults learn speech sounds in a second language. In my research, I use 
     electrophysiological and behavioural methods, including phonetic training games, 
     to understand how listeners learn to perceive and categorize speech sounds. 
     I am currently completing my postdoctoral research fellowship at University College London,
     investigating the role of input variability in second-language speech learning using 
     wearable EEG devices, which simultaneously 
     record EEG and speech data. See my code for EEG data analysis at <a href="https://github.com/BPericas" target="_blank" rel="noopener">@github</a>.
  username: username # general username
  github: BPericas # github username
  linkedin: https://www.linkedin.com/in/begoniapericasherrero/?locale=en # LinkedIn profile URL
  email: begona.herrero.17@ucl.ac.uk # email adress
  researchgate: Begona-Pericas-Herrero # ResearchGate profile name (verify this matches your actual profile URL)
  avatar: /assets/img/avatar.jpg # change with your own avatar
  avatar_width: 3000

# URL settings
url: "https://github.com/BPericas/BPericas.github.io" #
baseurl:
permalink: /:title/
google_analytics: # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
